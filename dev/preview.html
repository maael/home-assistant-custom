<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Home Assistant Custom card preview</title>
  <style>
    :root { --primary-color:#03a9f4; --primary-text-color:#212121; --secondary-text-color:#727272; --card-background-color:#fff; --ha-card-background:#fff; --secondary-background-color:#eee; --divider-color:rgba(0,0,0,.12); color-scheme:light; }
    * { box-sizing:border-box; } body { margin:0; padding:24px; font:14px system-ui,sans-serif; background:#eef1f5; color:var(--primary-text-color); }
    h1 { margin:0 0 20px; font-size:24px; } h2 { margin:0 0 8px; font-size:14px; font-weight:600; }
    .gallery { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:22px; align-items:start; }
    .example { min-width:0; } .frame { max-width:560px; } .wide { grid-column:1 / -1; } .graph-frame { max-width:900px; }
    .dark { --primary-text-color:#eee; --secondary-text-color:#aaa; --card-background-color:#1c1c1c; --ha-card-background:#1c1c1c; --secondary-background-color:#333; --divider-color:rgba(255,255,255,.14); --primary-color:#65b7e8; color-scheme:dark; background:#111; padding:14px; border-radius:12px; }
    .mobile { width:300px; max-width:100%; }
    .badge-frame { display:flex; flex-wrap:wrap; gap:12px; max-width:none; padding:14px; border-radius:12px; background:var(--card-background-color); }
    .badge-example { display:grid; gap:6px; color:var(--secondary-text-color); font-size:11px; }
    ha-card { display:block; border-radius:12px; box-shadow:0 2px 6px rgba(0,0,0,.16); background:var(--ha-card-background); }
    ha-badge { display:inline-flex; align-items:center; gap:6px; width:max-content; height:36px; padding:0 12px; border-radius:18px; color:var(--primary-text-color); background:var(--secondary-background-color); }
    ha-icon { display:inline-grid; place-items:center; }
    ha-icon::after { content:'◆'; font-size:10px; }
    code { color:var(--secondary-text-color); }
  </style>
</head>
<body>
  <h1>Home Assistant Custom development preview</h1>
  <div class="gallery" id="gallery"></div>
  <script type="module" src="./preview.js"></script>
</body>
</html>
